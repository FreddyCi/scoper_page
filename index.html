<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoper Doc Agent Demo</title>
  </head>
  <body>
    <div id="root">
      <!-- Matches AppBootScreen until React mounts (avoids “Scoper Doc Agent” text flash). -->
      <div
        class="app-initial-boot"
        role="status"
        aria-live="polite"
        aria-busy="true"
        style="
          min-height: 100svh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 1.5rem;
          background: #f3f2ee;
          color: #111827;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        "
      >
        <div
          aria-hidden="true"
          style="
            width: 2rem;
            height: 2rem;
            border: 2px solid #e5e7eb;
            border-top-color: #6b7280;
            border-radius: 9999px;
            animation: app-initial-boot-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin-top: 1rem; font-size: 0.875rem; font-weight: 500">Loading Scoper…</p>
      </div>
    </div>
    <style>
      @keyframes app-initial-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
